# Site settings for dr-farhan.github.io
# Built with Jekyll / Beautiful Jekyll for GitHub Pages

plugins:
  - jekyll-paginate
  - jekyll-seo-tag

url: "https://dr-farhan.github.io"
baseurl: ""

title: "Syed Farhan Ahmad"
description: "Postdoctoral Research Associate in computational genomics, repeat biology, and cancer genomics."
keywords: "Syed Farhan Ahmad, Farhan Ahmad, computational genomics, bioinformatics, transposable elements, repeat biology, cancer genomics, leukemia, B chromosomes"

navbar-links:
  About: "aboutme"
  Research: "research"
  Publications: "publications"
  Talks: "talks"
  Projects:
    - GitHub: "https://github.com/dr-farhan"
    - Research Software: "https://github.com/dr-farhan?tab=repositories"
    - Ongoing Work: "research#current-research"
  CV: "files/Farhan_Ahmad_CV.pdf"
  Contact: "contact"

avatar: "/img/farhan.jpeg"

# Design
navbar-col: "#FFFFFF"
navbar-text-col: "#1F2937"
navbar-children-col: "#FFFFFF"
page-col: "#FFFFFF"
link-col: "#0B5CAD"
hover-col: "#0F766E"
footer-col: "#F8FAFC"
footer-text-col: "#64748B"
footer-link-col: "#1F2937"

author:
  name: "Syed Farhan Ahmad"
  email: "syed.ahmad@stjude.edu"
  twitter: "farhanetal"

social-network-links:
  email: "syed.ahmad@stjude.edu"
  github: "dr-farhan"
  linkedin: "syed-farhan-ahmad-ba43a388"
  twitter: "farhanetal"
  google-scholar: "StQH4CMAAAAJ"
  orcid: "0000-0002-6596-0980"

share-links-active:
  twitter: true
  facebook: false
  google: false
  linkedin: true

# Analytics: add a GA4 measurement ID here only if you use analytics.
google_analytics: ""

# Misc
excerpt_length: 50
title-separator: "—"
timezone: "America/Chicago"
markdown: kramdown
highlighter: rouge
permalink: /:year-:month-:day-:title/
paginate: 5

kramdown:
  input: GFM

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      comments: false
      social-share: true
  - scope:
      path: ""
    values:
      layout: "page"
      show-avatar: true

link-tags: true

exclude:
  - CHANGELOG.md
  - CNAME
  - Dockerfile
  - Gemfile.lock
  - LICENSE
  - README.md
  - Vagrantfile
  - _backup

prose:
  rooturl: '_posts'
  media: 'img'
  ignore:
    - 404.html
    - LICENSE
    - feed.xml
    - _config.yml
    - /_layouts
    - /_includes
    - /css
    - /img
    - /js
